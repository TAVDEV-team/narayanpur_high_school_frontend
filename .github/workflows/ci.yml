name: CI

on:
  pull_request:
    branches:
      - main
      - dev

  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  commit-message:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          pattern='^(feat|fix|refactor|test|docs|chore|perf|style): .+'
          failed=0

          echo "Checking commits in this pull request..."

          while IFS= read -r message; do
            echo "Checking: $message"

            if [[ ! "$message" =~ $pattern ]]; then
              echo "❌ Invalid commit message: $message"
              failed=1
            else
              echo "✅ Valid commit message"
            fi
          done < <(git log --no-merges --format=%s "origin/${{ github.base_ref }}..HEAD")

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "Commit message validation failed."
            echo "Expected format: <type>: <description>"
            echo "Allowed types: feat, fix, refactor, test, docs, chore, perf, style"
            exit 1
          fi

          echo ""
          echo "All commit messages are valid."